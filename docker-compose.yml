services:
  reed:
    image: ghcr.io/simonives/reed:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      REED_API_KEY: ${REED_API_KEY:?Set REED_API_KEY in your .env file}
      REED_DATA_PATH: "/data/reed.kuzu"
      REED_POLL_DEFAULT_INTERVAL: "60"
    restart: unless-stopped
