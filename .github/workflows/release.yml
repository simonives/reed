name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip PyPI publish and GitHub Release creation'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute safe ref name
        id: ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: printf 'safe=%s\n' "${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy src/reed

      - name: Tests
        run: pytest

      - name: Dependency audit
        run: pip install pip-audit && pip-audit

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/simonives/reed
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=dryrun-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate application SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment \
            --output-format json \
            --output-file reed-${{ steps.ref.outputs.safe }}-sbom.json

      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/simonives/reed:${{ steps.meta.outputs.version }}
          output-file: reed-${{ steps.ref.outputs.safe }}-container-sbom.json
          format: cyclonedx-json

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            reed-${{ steps.ref.outputs.safe }}-sbom.json
            reed-${{ steps.ref.outputs.safe }}-container-sbom.json
            dist/*
