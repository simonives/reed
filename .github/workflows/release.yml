name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy src/reed

      - name: Tests
        run: pytest

      - name: Dependency audit
        run: pip install pip-audit && pip-audit

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/simonives/reed
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate application SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment \
            --output-format json \
            --outfile reed-${{ github.ref_name }}-sbom.json

      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/simonives/reed:${{ steps.meta.outputs.version }}
          output-file: reed-${{ github.ref_name }}-container-sbom.json
          format: cyclonedx-json

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            reed-${{ github.ref_name }}-sbom.json
            reed-${{ github.ref_name }}-container-sbom.json
            dist/*
